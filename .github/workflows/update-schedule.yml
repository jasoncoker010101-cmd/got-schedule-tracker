name: Update schedule

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      any_image:
        description: "Test mode: accept any image in the channel"
        type: boolean
        default: false
      reparse:
        description: "Re-read the saved image into the schedule"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Discord for a new schedule
        id: fetch
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ANY_IMAGE: ${{ github.event.inputs.any_image || 'false' }}
        run: python3 Script/fetch_schedule.py

      - name: Read the events from the image
        if: steps.fetch.outputs.new == 'true' || github.event.inputs.reparse == 'true'
        run: |
          installed=false

          for attempt in 1 2 3; do
            if sudo timeout 120s apt-get update -qq && \
               sudo timeout 180s apt-get install -y -qq tesseract-ocr python3-pil; then
              installed=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "APT failed or timed out; retrying in 10 seconds (attempt $attempt of 3)..."
              sleep 10
            fi
          done

          if [ "$installed" != "true" ]; then
            echo "Could not install OCR packages after 3 attempts."
            exit 1
          fi

          python3 -c "import PIL" || \
            python3 -m pip install --break-system-packages pillow

          python3 Script/parse_schedule.py

      - name: Save changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || \
            (git commit -m "Update schedule" && git push)
