<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake | G.O.T. Games</title>
<style>
  :root { --gold: #d4af37; --gold-soft: rgba(212, 175, 55, 0.35); --bg: #0b0b10; --panel: rgba(20, 20, 28, 0.94); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at top, #1b1b26 0%, var(--bg) 70%);
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    overflow: hidden;
  }

  /* ---------- Top nav (matches G.O.T. Games site header) ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    background: rgba(12, 12, 18, 0.9);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 1.5px; }
  .logo {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--gold);
    color: #111;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
  }
  nav { display: flex; gap: 6px; }
  nav a {
    color: #9a9aa6;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.9rem;
    transition: color 0.15s, background 0.15s;
  }
  nav a:hover { color: var(--gold); }
  nav a.active { background: var(--gold); color: #111; font-weight: 600; }

  /* ---------- HUD bar ---------- */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 28px;
    font-size: 0.9rem;
    color: #aaa;
    flex-shrink: 0;
  }
  .hud-stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .hud-stats b { color: var(--gold); font-weight: 700; }

  /* ---------- Board area fills the rest of the screen ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .wrap {
    position: relative;
    border: 2px solid var(--gold);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; background: #0a0a0f; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    padding: 16px;
    text-align: center;
    animation: fade 0.4s ease;
  }
  .overlay.hidden { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 12px;
    padding: 26px 30px;
    max-width: 520px;
    width: 100%;
  }
  .eyebrow {
    color: var(--gold);
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .title { font-size: 2.4rem; font-weight: 900; letter-spacing: 2px; margin: 0 0 4px; }
  .title span { color: var(--gold); }
  .subtitle { color: #8a8a96; font-size: 0.9rem; margin-bottom: 18px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .mode-btn {
    text-align: left;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #333;
    border-radius: 8px;
    color: #ddd;
  }
  .mode-btn small { display: block; color: #888; font-size: 0.78rem; margin-top: 4px; }
  .mode-btn.active { border-color: var(--gold); background: rgba(212, 175, 55, 0.12); color: var(--gold); }
  .desc { color: #aaa; font-size: 0.9rem; min-height: 1.3em; margin-bottom: 16px; }

  button {
    background: transparent;
    color: #eee;
    border: 1px solid #555;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button.primary {
    background: var(--gold);
    color: #111;
    border-color: var(--gold);
    font-weight: 700;
    padding: 11px 28px;
  }
  button.primary:hover { color: #111; filter: brightness(1.08); }

  .count { font-size: 7rem; font-weight: 900; color: var(--gold); animation: pop 0.8s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1.6); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: scale(0.8); opacity: 0; }
  }
  .final { color: var(--gold); font-size: 1.6rem; font-weight: 800; margin: 8px 0; }
  .hint { color: #888; font-size: 0.82rem; margin-top: 12px; }

  footer {
    text-align: center;
    color: #666;
    font-size: 0.8rem;
    padding: 8px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">G</div>
    <span>G.O.T. GAMES</span>
  </div>
  <nav>
    <a href="#">Schedule</a>
    <a href="#">Players</a>
    <a href="#">Profile</a>
    <a href="#" class="active">Games</a>
  </nav>
</header>

<div class="hud">
  <div class="hud-stats">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
    <span>Mode: <b id="modeLabel">Classic</b></span>
    <span>Level: <b id="levelLabel">1</b></span>
  </div>
  <button id="fsBtn">Full Screen (F)</button>
</div>

<main>
  <div class="wrap" id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay">
      <div class="card" id="overlayContent"></div>
    </div>
  </div>
</main>

<footer>Arrows / WASD to move &middot; Space to pause &middot; Enter to start &middot; M for menu &middot; F for full screen &middot; Swipe on mobile</footer>

<script>
// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const main = document.querySelector('main');
const overlay = document.getElementById('overlay');
const content = document.getElementById('overlayContent');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const modeEl = document.getElementById('modeLabel');
const levelEl = document.getElementById('levelLabel');
const fsBtn = document.getElementById('fsBtn');

// Logical grid. The canvas scales to fit the screen, so drawing uses CELL units.
const CELL = 24;
const COLS = 24;
const ROWS = 24;

// Fit the square board to the available space, sharp on high-DPI screens
function resizeBoard() {
  const padding = 24; // main has 12px padding on each side
  const size = Math.max(200, Math.floor(Math.min(main.clientWidth, main.clientHeight) - padding - 4));
  const dpr = window.devicePixelRatio || 1;
  wrap.style.width = size + 'px';
  wrap.style.height = size + 'px';
  canvas.width = Math.floor(size * dpr);
  canvas.height = Math.floor(size * dpr);
  const scale = canvas.width / (COLS * CELL);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

// ---------- Modes ----------
const MODES = {
  classic: {
    name: 'Classic',
    desc: 'Walls are deadly. Classic snake, no tricks.',
    walls: true, poison: false,
    baseSpeed: 140, step: 8, minSpeed: 60
  },
  nowalls: {
    name: 'No Walls',
    desc: 'The edges wrap around. Watch your position.',
    walls: false, poison: false,
    baseSpeed: 140, step: 8, minSpeed: 60
  },
  fast: {
    name: 'Fast Mode',
    desc: 'Starts quick and ramps up hard.',
    walls: true, poison: false,
    baseSpeed: 85, step: 6, minSpeed: 45
  },
  poison: {
    name: 'Poison Fruit',
    desc: 'Purple poison shrinks you by two. Avoid it.',
    walls: true, poison: true,
    baseSpeed: 130, step: 8, minSpeed: 60
  }
};

// ---------- State ----------
let state = 'menu';          // menu | countdown | playing | paused | over
let selectedKey = 'classic';
let modeKey = 'classic';

let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = null;
let poison = [];
let bonus = null;            // { x, y, type: 'gold' | 'blue', expires }
let score = 0;
let foodCount = 0;
let slowUntil = 0;
let lastTick = 0;

// ---------- Helpers ----------
const samePos = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;

function isOccupied(x, y) {
  if (snake.some(s => s.x === x && s.y === y)) return true;
  if (food && food.x === x && food.y === y) return true;
  if (bonus && bonus.x === x && bonus.y === y) return true;
  return poison.some(p => p.x === x && p.y === y);
}

function freeCell() {
  let x, y, tries = 0;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
    tries++;
  } while (isOccupied(x, y) && tries < 2000);
  return { x, y };
}

function spawnFood() {
  food = freeCell();
}

function spawnPoison() {
  const cap = Math.min(2 + Math.floor(foodCount / 4), 10);
  if (poison.length < cap) poison.push(freeCell());
}

function spawnBonus() {
  const cell = freeCell();
  bonus = {
    x: cell.x,
    y: cell.y,
    type: Math.random() < 0.6 ? 'gold' : 'blue',
    expires: Date.now() + 7000
  };
}

function level() {
  return Math.floor(foodCount / 5) + 1;
}

function getInterval() {
  const m = MODES[modeKey];
  let ms = Math.max(m.minSpeed, m.baseSpeed - (level() - 1) * m.step);
  if (Date.now() < slowUntil) ms *= 1.8;
  return ms;
}

function bestKey(key) { return 'snakeBest_' + key; }
function getBest(key) { return Number(localStorage.getItem(bestKey(key)) || 0); }

function updateHud() {
  const k = state === 'menu' ? selectedKey : modeKey;
  scoreEl.textContent = score;
  bestEl.textContent = getBest(k);
  modeEl.textContent = MODES[k].name;
  levelEl.textContent = level();
}

function showOverlay(html) {
  content.innerHTML = html;
  overlay.classList.remove('hidden');
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

// ---------- Game flow ----------
function resetGame() {
  modeKey = selectedKey;
  const mid = Math.floor(COLS / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  foodCount = 0;
  poison = [];
  bonus = null;
  slowUntil = 0;
  lastTick = 0;
  spawnFood();
  if (MODES[modeKey].poison) {
    spawnPoison();
    spawnPoison();
  }
  updateHud();
}

function showMenu() {
  state = 'menu';
  const buttons = Object.entries(MODES).map(([key, m], i) => `
    <button class="mode-btn ${key === selectedKey ? 'active' : ''}" data-mode="${key}">
      ${i + 1}. ${m.name}
      <small>${m.desc}</small>
    </button>`).join('');
  showOverlay(`
    <div class="eyebrow">G.O.T. Games Original</div>
    <div class="title">G.O.T. <span>SNAKE</span></div>
    <div class="subtitle">Eat. Grow. Don't bite yourself.</div>
    <div class="modes">${buttons}</div>
    <div class="desc">${MODES[selectedKey].desc}</div>
    <button class="primary" id="startBtn">Start Game</button>
    <div class="hint">Press 1-4 to pick a mode, Enter to start</div>
  `);
  content.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedKey = btn.dataset.mode;
      showMenu();
    });
  });
  document.getElementById('startBtn').addEventListener('click', startCountdown);
  updateHud();
}

function startCountdown() {
  if (state === 'countdown' || state === 'playing') return;
  resetGame();
  state = 'countdown';
  const steps = ['3', '2', '1', 'GO!'];
  let i = 0;
  const next = () => {
    if (i < steps.length) {
      showOverlay(`<div class="count">${steps[i]}</div>`);
      i++;
      setTimeout(next, 800);
    } else {
      hideOverlay();
      state = 'playing';
    }
  };
  next();
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    showOverlay(`
      <div>
        <div class="title">PAUSED</div>
        <div class="hint">Space to resume &middot; M for menu</div>
      </div>
    `);
  } else if (state === 'paused') {
    state = 'playing';
    hideOverlay();
    lastTick = 0;
  }
}

function gameOver() {
  state = 'over';
  const best = Math.max(score, getBest(modeKey));
  localStorage.setItem(bestKey(modeKey), best);
  showOverlay(`
    <div>
      <div class="eyebrow">Game Over</div>
      <div class="title">THE SNAKE <span>FELL</span></div>
      <div class="final">Final score: ${score}</div>
      <div class="subtitle">Best in ${MODES[modeKey].name}: ${best}</div>
      <button class="primary" id="againBtn">Play Again</button>
      <div class="hint">Enter to play again &middot; M for menu</div>
    </div>
  `);
  document.getElementById('againBtn').addEventListener('click', startCountdown);
  updateHud();
}

// ---------- Movement ----------
function setDirection(dx, dy) {
  if (state !== 'playing') return;
  // Blocks reversing into the neck, checked against the current heading and the pending one,
  // so two quick key presses in one tick cannot reverse the snake.
  if (dx === -direction.x && dy === -direction.y) return;
  if (dx === -nextDirection.x && dy === -nextDirection.y) return;
  if (dx === nextDirection.x && dy === nextDirection.y) return;
  nextDirection = { x: dx, y: dy };
}

function tick() {
  direction = nextDirection;
  const now = Date.now();
  if (bonus && now > bonus.expires) bonus = null;

  let hx = snake[0].x + direction.x;
  let hy = snake[0].y + direction.y;

  if (MODES[modeKey].walls) {
    if (hx < 0 || hy < 0 || hx >= COLS || hy >= ROWS) return gameOver();
  } else {
    hx = (hx + COLS) % COLS;
    hy = (hy + ROWS) % ROWS;
  }

  const head = { x: hx, y: hy };
  const ateFood = samePos(head, food);
  const ateBonus = !!bonus && samePos(head, bonus);
  const bonusType = ateBonus ? bonus.type : null;
  const poisonIdx = poison.findIndex(p => samePos(p, head));
  const grow = ateFood || bonusType === 'gold';

  // The tail moves away this tick unless the snake grows, so moving into the tail's cell is allowed
  const bodyToCheck = grow ? snake : snake.slice(0, -1);
  if (bodyToCheck.some(s => samePos(s, head))) return gameOver();

  snake.unshift(head);
  if (!grow) snake.pop();

  if (ateFood) {
    score += 10;
    foodCount++;
    spawnFood();
    if (MODES[modeKey].poison && foodCount % 3 === 0) spawnPoison();
    if (!bonus && Math.random() < 0.3) spawnBonus();
  }

  if (ateBonus) {
    if (bonusType === 'gold') score += 50;
    if (bonusType === 'blue') slowUntil = now + 5000;
    bonus = null;
  }

  if (poisonIdx >= 0) {
    poison.splice(poisonIdx, 1);
    if (snake.length <= 3) return gameOver();
    snake.pop();
    snake.pop();
  }

  updateHud();
}

// ---------- Drawing ----------
function center(p) {
  return { x: p.x * CELL + CELL / 2, y: p.y * CELL + CELL / 2 };
}

function drawGrid() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= COLS; i++) {
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, ROWS * CELL);
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.moveTo(0, j * CELL);
    ctx.lineTo(COLS * CELL, j * CELL);
  }
  ctx.stroke();
}

function drawFood(p, pulse) {
  const c = center(p);
  const r = CELL * 0.36;
  ctx.save();
  ctx.shadowColor = '#ff3b3b';
  ctx.shadowBlur = 12 + pulse * 8;
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(c.x, c.y + 2, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - r + 2);
  ctx.quadraticCurveTo(c.x + 4, c.y - r - 5, c.x + 8, c.y - r - 2);
  ctx.stroke();
  ctx.restore();
}

function drawPoison(p, pulse) {
  const c = center(p);
  const r = CELL * 0.36;
  ctx.save();
  ctx.shadowColor = '#b150ff';
  ctx.shadowBlur = 10 + pulse * 6;
  ctx.fillStyle = '#6a1b9a';
  ctx.beginPath();
  ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#e1bee7';
  ctx.lineWidth = 2;
  const k = r * 0.5;
  ctx.beginPath();
  ctx.moveTo(c.x - k, c.y - k);
  ctx.lineTo(c.x + k, c.y + k);
  ctx.moveTo(c.x + k, c.y - k);
  ctx.lineTo(c.x - k, c.y + k);
  ctx.stroke();
  ctx.restore();
}

function drawBonus(b, pulse) {
  if (b.expires - Date.now() < 2000 && Math.floor(Date.now() / 150) % 2) return;
  const c = center(b);
  const r = CELL * (0.38 + 0.04 * pulse);
  const color = b.type === 'gold' ? '#ffd700' : '#40c4ff';
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = color;
  ctx.beginPath();
  if (b.type === 'gold') {
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.45 : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(c.x + rad * Math.cos(a), c.y + rad * Math.sin(a));
    }
  } else {
    ctx.moveTo(c.x, c.y - r);
    ctx.lineTo(c.x + r * 0.8, c.y);
    ctx.lineTo(c.x, c.y + r);
    ctx.lineTo(c.x - r * 0.8, c.y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSnake(ts) {
  if (!snake.length) return;
  const isSlow = Date.now() < slowUntil;

  // Body: connected rounded segments that darken toward the tail
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = snake.length - 1; i >= 1; i--) {
    const a = center(snake[i]);
    const b = center(snake[i - 1]);
    const t = i / snake.length;
    const light = 56 - t * 22;
    ctx.strokeStyle = `hsl(${isSlow ? 200 : 45}, 80%, ${light}%)`;
    ctx.lineWidth = CELL * 0.84;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Head
  const c = center(snake[0]);
  const dx = direction.x;
  const dy = direction.y;
  const headColor = isSlow ? '#7fdcff' : '#ffd54a';

  ctx.fillStyle = headColor;
  ctx.shadowColor = headColor;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(c.x, c.y, CELL * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Eyes sit forward on the head and split to either side of the heading
  const fx = dx * CELL * 0.22;
  const fy = dy * CELL * 0.22;
  const sx = -dy * CELL * 0.2;
  const sy = dx * CELL * 0.2;
  [1, -1].forEach(side => {
    const ex = c.x + fx + sx * side;
    const ey = c.y + fy + sy * side;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex, ey, CELL * 0.13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(ex + dx * CELL * 0.05, ey + dy * CELL * 0.05, CELL * 0.065, 0, Math.PI * 2);
    ctx.fill();
  });

  // Tongue flicks out in a short burst every 1.4 seconds
  if (ts % 1400 < 380) {
    const bx = c.x + dx * CELL * 0.5;
    const by = c.y + dy * CELL * 0.5;
    const tipX = bx + dx * CELL * 0.45;
    const tipY = by + dy * CELL * 0.45;
    ctx.strokeStyle = '#ff5252';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(tipX, tipY);
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + dx * 5 - dy * 5, tipY + dy * 5 + dx * 5);
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + dx * 5 + dy * 5, tipY + dy * 5 - dx * 5);
    ctx.stroke();
  }
}

function draw(ts) {
  drawGrid();
  const pulse = 0.5 + 0.5 * Math.sin(ts / 200);
  if (food) drawFood(food, pulse);
  poison.forEach(p => drawPoison(p, pulse));
  if (bonus) drawBonus(bonus, pulse);
  drawSnake(ts);
}

// ---------- Main loop ----------
function loop(ts) {
  if (state === 'playing') {
    if (!lastTick) lastTick = ts;
    if (ts - lastTick >= getInterval()) {
      lastTick = ts;
      tick();
    }
  } else {
    lastTick = 0;
  }
  draw(ts);
  requestAnimationFrame(loop);
}

// ---------- Full screen ----------
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? 'Exit Full Screen (F)' : 'Full Screen (F)';
  resizeBoard();
});
window.addEventListener('resize', resizeBoard);

// ---------- Input ----------
const DIR_KEYS = {
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
  ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
  ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
};

document.addEventListener('keydown', e => {
  if (DIR_KEYS[e.key]) {
    e.preventDefault();
    const [dx, dy] = DIR_KEYS[e.key];
    setDirection(dx, dy);
    return;
  }
  if (e.key === ' ') {
    e.preventDefault();
    togglePause();
  } else if (e.key === 'Enter') {
    if (state === 'menu' || state === 'over') startCountdown();
  } else if (e.key === 'm' || e.key === 'M' || e.key === 'Escape') {
    if (state === 'over' || state === 'paused') showMenu();
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullscreen();
  } else if (state === 'menu' && ['1', '2', '3', '4'].includes(e.key)) {
    selectedKey = Object.keys(MODES)[Number(e.key) - 1];
    showMenu();
  }
});

let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
  else setDirection(0, dy > 0 ? 1 : -1);
});

// ---------- Start ----------
resizeBoard();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
