<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile | G.O.T. Games</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      color-scheme: dark;
      --background: #101114;
      --surface: #191b20;
      --surface-light: #22252c;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #8b7cff;
      --border: #30323a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Bricolage Grotesque", sans-serif;
    }

    button, a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .logo span {
      color: var(--accent);
    }

    .back-link {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      color: var(--text);
    }

    main {
      width: min(900px, 92%);
      margin: 45px auto;
    }

    .profile-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .banner {
      height: 220px;
      background:
        radial-gradient(circle at 75% 20%, #6254bd 0, transparent 35%),
        linear-gradient(120deg, #25213e, #38305e, #171923);
      background-position: center;
      background-size: cover;
    }

    .profile-content {
      padding: 0 35px 35px;
    }

    .profile-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-top: -58px;
    }

    .avatar {
      width: 116px;
      height: 116px;
      flex-shrink: 0;
      border: 5px solid var(--surface);
      border-radius: 50%;
      background: var(--surface-light);
      object-fit: cover;
    }

    .profile-info {
      padding-top: 18px;
    }

    .username {
      margin: 0;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .profile-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .profile-details {
      margin-top: 30px;
      display: grid;
      gap: 22px;
    }

    .detail-section {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-light);
    }

    .detail-section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .detail-section p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .platform {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
    }

    .message {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
    }

    .message h1 {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 25px;
    }

    .message p {
      margin: 0;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    footer {
      padding: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 5%;
      }

      main {
        margin: 25px auto;
      }

      .banner {
        height: 155px;
      }

      .profile-content {
        padding: 0 18px 22px;
      }

      .profile-top {
        margin-top: -48px;
      }

      .avatar {
        width: 96px;
        height: 96px;
      }

      .detail-section {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="logo" href="index.html">G.O.T. <span>Games</span></a>
    <a class="back-link" href="index.html">← Back to Schedule</a>
  </header>

  <main>
    <div id="loading" class="profile-card message">
      <h1>Loading profile...</h1>
      <p>Please wait.</p>
    </div>

    <div id="notFound" class="profile-card message hidden">
      <h1>Profile not found</h1>
      <p>We couldn't find a player with that username.</p>
    </div>

    <div id="profileCard" class="profile-card hidden">
      <div id="banner" class="banner"></div>

      <div class="profile-content">
        <div class="profile-top">
          <img
            id="avatar"
            class="avatar"
            src=""
            alt="Profile picture"
          >

          <div class="profile-info">
            <h1 id="username" class="username"></h1>
            <div class="profile-label">G.O.T. Games Player</div>
          </div>
        </div>

        <div class="profile-details">
          <section class="detail-section">
            <h2>About Me</h2>
            <p id="bio">This player hasn't added a bio yet.</p>
          </section>

          <section class="detail-section">
            <h2>Favorite Platform</h2>
            <span id="platform" class="platform">Not specified</span>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer>
    G.O.T. Games is an unofficial fan site.
  </footer>

  <script>
    const SUPABASE_URL = "https://tzgxkiucsjampbresqkw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hOSPQ3wZ9TB3cqsj0ruHXQ_TLjEVN9E";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loading = document.getElementById("loading");
    const notFound = document.getElementById("notFound");
    const profileCard = document.getElementById("profileCard");

    function showNotFound() {
      loading.classList.add("hidden");
      profileCard.classList.add("hidden");
      notFound.classList.remove("hidden");
    }

    async function loadProfile() {
      try {
        const params = new URLSearchParams(window.location.search);
        let requestedUsername = params.get("username");

        // If no username is in the URL, try showing the
        // currently signed-in user's own profile.
        if (!requestedUsername) {
          const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

          if (sessionError) throw sessionError;

          if (!sessionData.session) {
            showNotFound();
            return;
          }

          const userId = sessionData.session.user.id;

          const { data: ownProfile, error: ownError } =
            await supabaseClient
              .from("profiles")
              .select("username")
              .eq("id", userId)
              .maybeSingle();

          if (ownError) throw ownError;

          if (!ownProfile) {
            showNotFound();
            return;
          }

          requestedUsername = ownProfile.username;
        }

        const { data: profile, error } = await supabaseClient
          .from("profiles")
          .select("username, avatar_url, banner_url, bio, favorite_platform")
          .ilike("username", requestedUsername)
          .maybeSingle();

        if (error) throw error;

        if (!profile) {
          showNotFound();
          return;
        }

        document.getElementById("username").textContent =
          profile.username;

        document.getElementById("bio").textContent =
          profile.bio || "This player hasn't added a bio yet.";

        document.getElementById("platform").textContent =
          profile.favorite_platform || "Not specified";

        const avatar = document.getElementById("avatar");

        if (profile.avatar_url) {
          avatar.src = profile.avatar_url;
        } else {
          avatar.src =
            "https://placehold.co/300x300/22252c/ffffff?text=Player";
        }

        if (profile.banner_url) {
          document.getElementById("banner").style.backgroundImage =
            `url("${profile.banner_url}")`;
        }

        // Update the browser tab title.
        document.title = profile.username + " | G.O.T. Games";

        loading.classList.add("hidden");
        notFound.classList.add("hidden");
        profileCard.classList.remove("hidden");

      } catch (error) {
        console.error("Profile loading error:", error);
        showNotFound();
      }
    }

    loadProfile();
  </script>

</body>
</html>
