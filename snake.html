<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 { margin: 0 0 10px 0; }
    .score-board { font-size: 20px; margin-bottom: 10px; }
    canvas {
      border: 4px solid #4CAF50;
      background-color: #000000;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #45a049; }
  </style>
</head>
<body>

  <h1>🐍 Snake</h1>
  <div class="score-board">Score: <span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <button onclick="resetGame()">Restart Game</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const box = 20;

    // --- EASY SETTINGS TO EDIT ---
    let gameSpeed = 120; // Lower = faster, Higher = slower
    const fruits = ["🍎", "🍌", "🍒", "🍇", "🍓"]; // Edit or add fruit emojis here!
    let snakeHeadColor = "#4CAF50";
    let snakeBodyColor = "#8BC34A";
    // -----------------------------

    let snake, direction, food, score, gameLoop;

    function init() {
      snake = [{ x: 9 * box, y: 10 * box }];
      direction = "RIGHT";
      score = 0;
      document.getElementById("score").innerText = score;
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(draw, gameSpeed);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * 19 + 1) * box,
        y: Math.floor(Math.random() * 19 + 1) * box,
        emoji: fruits[Math.floor(Math.random() * fruits.length)]
      };
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault(); // Stops page from scrolling when pressing arrow keys
      }
      if (e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
      if (e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
      if (e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
      if (e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
    });

    function draw() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? snakeHeadColor : snakeBodyColor;
        ctx.fillRect(snake[i].x, snake[i].y, box, box);
      }

      // Draw Fruit Emoji
      ctx.font = "18px Arial";
      ctx.fillText(food.emoji, food.x + 1, food.y + 17);

      // Move Snake
      let headX = snake[0].x;
      let headY = snake[0].y;
      if (direction === "LEFT") headX -= box;
      if (direction === "UP") headY -= box;
      if (direction === "RIGHT") headX += box;
      if (direction === "DOWN") headY += box;

      // Eat Fruit
      if (headX === food.x && headY === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;
        spawnFood();
      } else {
        snake.pop();
      }

      const newHead = { x: headX, y: headY };

      // Check Wall or Self Collision
      if (
        headX < 0 || headY < 0 ||
        headX >= canvas.width || headY >= canvas.height ||
        snake.some(part => part.x === newHead.x && part.y === newHead.y)
      ) {
        clearInterval(gameLoop);
        alert("Game Over! Final Score: " + score);
        return;
      }

      snake.unshift(newHead);
    }

    function resetGame() {
      init();
    }

    init();
  </script>
</body>
</html>
