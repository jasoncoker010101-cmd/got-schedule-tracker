name: Update schedule

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      any_image:
        description: "Test mode: accept any image in the channel"
        type: boolean
        default: false
      reparse:
        description: "Re-read the saved image into the schedule"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Discord for a new schedule
        id: fetch
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ANY_IMAGE: ${{ github.event.inputs.any_image || 'false' }}
        run: python3 Script/fetch_schedule.py

      - name: Read the events from the image
        if: ${{ steps.fetch.outputs.new == 'true' || inputs.reparse }}
        run: |
          installed=false

          for attempt in 1 2 3; do
            echo "APT attempt $attempt of 3: updating package lists..."

            if ! sudo timeout 180s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              echo "apt-get update failed or timed out."
            elif ! sudo timeout 180s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              install -y tesseract-ocr python3-pil; then
              echo "Installing Tesseract or Pillow failed or timed out."
            else
              installed=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          if [ "$installed" != "true" ]; then
            echo "Could not install OCR packages after 3 attempts."
            exit 1
          fi

          python3 -c "import PIL" || \
            python3 -m pip install --break-system-packages pillow

          python3 Script/parse_schedule.py

      - name: Save changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || \
            (git commit -m "Update schedule" && git push)
