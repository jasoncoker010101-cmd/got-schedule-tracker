name: Update schedule

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      message_id:
        description: "Optional Discord message ID in the configured channel"
        type: string
      reparse:
        description: "Read the checked-in flyer instead of Discord"
        type: boolean
        default: false
      dry_run:
        description: "Check Discord and OCR without publishing any data"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up OCR
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y tesseract-ocr python3-pil
          /usr/bin/python3 -c 'from PIL import Image'
      - name: Find and validate the schedule
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_TRUSTED_AUTHOR_IDS: ${{ vars.DISCORD_TRUSTED_AUTHOR_IDS }}
          MESSAGE_ID: ${{ inputs.message_id }}
          REPARSE: ${{ inputs.reparse || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          [[ -z "$MESSAGE_ID" ]] || args+=(--message-id "$MESSAGE_ID")
          [[ "$REPARSE" != true ]] || args+=(--reparse)
          [[ "$DRY_RUN" != true ]] || args+=(--dry-run)
          /usr/bin/python3 Script/fetch_schedule.py "${args[@]}"
      - name: Fetch show posters
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN || secrets.TMBD_READ_TOKEN }}
        run: python3 Script/fetch_posters.py
      - name: Verify Rumble entries on Patreon
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: python3 Script/check_patreon.py
      - name: Commit validated site data
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- schedule.json schedule/ shows.json patreon-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update validated schedule data"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Could not publish schedule after three attempts"
          exit 1
